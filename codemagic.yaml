workflows:
  macos-cli:
    name: macOS CLI Build
    environment:
      xcode: 15.4
    scripts:
      - name: Build xcproj command-line tool
        script: |
          set -e
          xcodebuild -project xcproj.xcodeproj -scheme xcproj -configuration Release
      - name: Zip binary
        script: |
          mkdir -p artifacts
          find build/Release -type f -perm +111 -exec cp {} artifacts/ \;
          cd artifacts && zip -r xcproj_build.zip *
    artifacts:
      - artifacts/xcproj_build.zip
